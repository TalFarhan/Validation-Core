[pytest]
testpaths = tests
addopts =
    -v
    --tb=short
    --strict-markers
    --self-contained-html
    --alluredir=results/allure-results
markers =
    sanity: quick smoke tests
    data: tests that validate data against the database
    regression: full regression suite (data validation, tables, charts, edge cases)

# --- ReportPortal (opt-in) ---
# Reporting is OFF by default: --reportportal is intentionally NOT in addopts,
# so existing runs and CI are unchanged. Enable a run with: pytest --reportportal
# Base URL of the ReportPortal instance from docker-compose.reportportal.yml.
rp_endpoint = http://localhost:8080
# Target project created in the ReportPortal UI after first bring-up.
rp_project = validation_core
# API token sourced from the RP_API_KEY environment variable; never committed as a literal.
rp_api_key = ${RP_API_KEY}
# Human-readable launch name shown on the ReportPortal dashboard.
rp_launch = Validation-Core UI Suite
# Launch attributes (key:value) for filtering runs; generic run metadata only, no domain labels.
rp_launch_attributes = env:local suite:ui
